name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  INTG_NAME: uc-intg-doorbird
  PYINSTALLER_TAG: 3.11.13-0.7.0

jobs:
  build:
    name: Build aarch64 driver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build binary with pyinstaller (aarch64)
        run: |
          docker run --rm --platform=linux/arm64 \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            docker.io/unfoldedcircle/r2-pyinstaller:${PYINSTALLER_TAG} \
            bash -c "cd /workspace && \
              python -m pip install -r requirements.txt && \
              pyinstaller --clean --onedir --name driver \
                --add-data driver.json:. \
                intg-doorbird/driver.py"

      - name: Package archive
        run: |
          mkdir -p artifacts/bin
          sudo cp -r dist/driver/* artifacts/bin/
          sudo cp driver.json artifacts/
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          sudo tar -czf "${INTG_NAME}-${VERSION}-aarch64.tar.gz" -C artifacts .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.INTG_NAME }}-${{ env.VERSION }}-aarch64
          path: ${{ env.INTG_NAME }}-*.tar.gz
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ env.INTG_NAME }}-*.tar.gz
